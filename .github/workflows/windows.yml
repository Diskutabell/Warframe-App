# Builds both Windows exes (without and with the memory scan) on a real Windows machine. Every
# push to main checks that they build and read a reward screen; publishing a release attaches both
# to it.
name: Windows

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The `catalog` pre-release holds game data, not the app (catalog.yml).
    if: github.event_name != 'release' || github.event.release.tag_name != 'catalog'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The engine embeds the built UI (web/dist).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - name: Test
        run: cargo test

      # Makes real overlay windows (ignored in ordinary test runs): styles, placement, drawing
      # through UpdateLayeredWindow, and no focus taken.
      - name: Test the overlay windows
        run: cargo test overlay_window -- --ignored

      # `cargo test` writes the API's TypeScript types; the committed ones must be the same.
      - name: Check the UI's API types
        shell: bash
        run: |
          changed=$(git status --porcelain -- web/src/types)
          if [ -n "$changed" ]; then echo "$changed"; echo "web/src/types is out of date: run cargo test and commit it"; exit 1; fi

      # The OCR program goes into both exes, so Windows users have nothing to install.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-tesseract-ocr zip
      - name: Pack tesseract
        shell: msys2 {0}
        run: bash .github/bundle-tesseract.sh "$(cygpath -u "$GITHUB_WORKSPACE")/tesseract.zip"

      # Both release exes carry tesseract and link the C runtime statically (no Visual C++
      # redistributable). Sharing `target` and `RUSTFLAGS` compiles dependencies once.
      - uses: ilammy/msvc-dev-cmd@v1

      # The plain exe is built without the memory scan and must not be able to open or read
      # another process: none of those calls may be among its imports.
      - name: Build without the memory scan
        shell: powershell
        env:
          WFP_TESSERACT_ZIP: ${{ github.workspace }}\tesseract.zip
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --no-default-features --features bundled-tesseract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\warframeproject.exe warframeproject-windows-x64.exe
          $imports = dumpbin /imports warframeproject-windows-x64.exe | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($imports -notmatch "kernel32\.dll") { throw "dumpbin output looks empty" }
          $found = @("OpenProcess", "ReadProcessMemory", "VirtualQueryEx", "CreateToolhelp32Snapshot", "Process32FirstW", "Process32NextW") |
            Where-Object { $imports -match "\b$_\b" }
          if ($found) { throw "a build without the memory scan imports: $($found -join ', ')" }

      - name: Build with the memory scan
        shell: powershell
        env:
          WFP_TESSERACT_ZIP: ${{ github.workspace }}\tesseract.zip
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --features bundled-tesseract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\warframeproject.exe warframeproject-windows-x64-memscan.exe
          $imports = dumpbin /imports warframeproject-windows-x64-memscan.exe | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($imports -notmatch "\bReadProcessMemory\b") {
            throw "the build with the memory scan is missing ReadProcessMemory"
          }

      # Draws a reward screen as the game lays it out at 1920x1080 and 100% interface scale - four
      # cards, 242 px wide, centred, each name bottom-aligned above its rarity bar - and has each
      # exe read it with nothing but Windows itself on PATH: proves the packed OCR is complete.
      - name: Read a reward screen with both exes
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $names = "Braton Prime Receiver", "Paris Prime String", "Forma Blueprint", "Ash Prime Systems Blueprint"
          $bmp = New-Object System.Drawing.Bitmap 1920, 1080
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(11, 18, 24))
          $font = New-Object System.Drawing.Font("Arial", 20, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(190, 220, 255))
          $outline = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(12, 8, 10))
          $bar = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(130, 78, 56))
          $bottom = New-Object System.Drawing.StringFormat
          $bottom.Alignment = [System.Drawing.StringAlignment]::Center
          $bottom.LineAlignment = [System.Drawing.StringAlignment]::Far
          for ($i = 0; $i -lt 4; $i++) {
            $x = 476 + 242 * $i
            $g.DrawString($names[$i], $font, $brush, (New-Object System.Drawing.RectangleF ($x + 6), 390, 230, 67), $bottom)
            $g.FillRectangle($outline, $x + 4, 473, 234, 11)
            $g.FillRectangle($bar, $x + 4, 476, 234, 5)
          }
          $bmp.Save("$PWD\frame.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($exe in @("warframeproject-windows-x64.exe", "warframeproject-windows-x64-memscan.exe")) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:LOCALAPPDATA\warframeproject\cache\tesseract-*"
            $p = Start-Process -FilePath ".\$exe" -ArgumentList "replay", "frame.png" `
              -NoNewWindow -Wait -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            Write-Host "=== $exe ==="
            Get-Content out.txt, err.txt
            $read = @($names | Where-Object { (Get-Content out.txt -Raw) -match [regex]::Escape($_) }).Count
            if ($p.ExitCode -ne 0 -or $read -lt 3) { throw "${exe}: read $read of 4 names (exit code $($p.ExitCode))" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: warframeproject-windows-x64
          path: warframeproject-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: warframeproject-windows-x64-memscan
          path: warframeproject-windows-x64-memscan.exe

      - name: Attach to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            warframeproject-windows-x64.exe \
            warframeproject-windows-x64-memscan.exe \
            --clobber
