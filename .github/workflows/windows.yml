# Builds the Windows exe on a real Windows machine. Every push to main checks that it still
# builds and passes the tests; a version tag also attaches the exe to that release.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: cp target/release/warframeproject.exe warframeproject-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: warframeproject-windows-x64
          path: warframeproject-windows-x64.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is normally made by hand right after the tag is pushed; make one if not.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" warframeproject-windows-x64.exe --clobber
