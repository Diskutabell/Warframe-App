<!doctype html>
<!-- The in-game overlays on Windows: one transparent window per overlay loads this page, and the
     app calls render() with a scan result and the size to draw at (CSS pixels per unit of the
     reward screen, as the game draws its cards). On Linux the overlays are GTK widgets instead
     (src/desktop/overlay.rs); the look is the same. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts.css">
<style>
  :root { --u: 1px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 13px "Source Sans 3", "Segoe UI", sans-serif; color: #a3b0b8; }
  #root { height: 100%; box-sizing: border-box; position: relative; }

  /* One panel under each reward card; a card read without a name keeps its place, empty. */
  .slots { display: flex; gap: calc(8 * var(--u)); height: 100%; }
  .slot { flex: 1 1 0; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column;
          justify-content: center; padding: calc(5 * var(--u)) calc(9 * var(--u));
          background: rgba(8, 12, 17, 0.97); border: 1px solid rgba(150, 170, 186, 0.3); border-radius: calc(3 * var(--u)); }
  .slot.empty { visibility: hidden; }
  .slot.best { background: rgba(45, 37, 15, 0.97); border-color: #d9b45a; }
  .top { display: flex; align-items: center; gap: calc(6 * var(--u)); min-width: 0; }
  .name { flex: 1; min-width: 0; font: 600 calc(14.5 * var(--u)) "Rajdhani", "Arial Narrow", sans-serif; color: #a9b7c2;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font: 700 calc(12 * var(--u)) "Rajdhani", sans-serif; color: #1b1407; background: #d9b45a;
         border-radius: 2px; padding: 0 calc(4 * var(--u)); }
  .money { display: flex; align-items: center; gap: calc(4 * var(--u)); }
  .money .p { height: calc(20 * var(--u)); }
  .plat { font: 700 calc(27 * var(--u)) / 1.15 "Rajdhani", "Arial Narrow", sans-serif; color: #f1d58b; }
  .plat.none { color: #6f7d89; }
  .ducats { margin-left: auto; display: flex; align-items: center; gap: calc(3 * var(--u));
            font: 600 calc(16 * var(--u)) "Rajdhani", sans-serif; color: #c9aa65; }
  .ducats img { height: calc(16 * var(--u)); }
  .info { font-size: calc(13 * var(--u)); color: #8a99a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .needed { color: #6fd1c6; font-weight: 700; }
  .vaulted { color: #e39a6b; }
  .err { color: #e2895f; font-size: calc(13 * var(--u)); }

  .panel { height: 100%; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
           background: rgba(8, 10, 14, 0.93); border: 1px solid #2d4150; border-left: 3px solid #d4b26a; border-radius: 4px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .weapon { font: 700 23px "Rajdhani", sans-serif; color: #eee; }
  .dots { color: #d4b26a; font-size: 15px; }
  .row { display: flex; gap: 10px; align-items: baseline; border-top: 1px solid #1e2b36; padding: 6px 0; }
  .stat { flex: 1; font-size: 16px; color: #eee; }
  .grade { font: 700 17px "Rajdhani", sans-serif; }
  .grade.a { color: #8ce39a; } .grade.b { color: #d4b26a; } .grade.c { color: #e2895f; }
  .dev { width: 8ch; text-align: right; }
  .warn { color: #e2895f; }
  .foot { color: #6d7b88; font-size: 11.5px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const DOTS = ["", "●○○○○", "●●○○○", "●●●○○", "●●●●○", "●●●●●"];
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const root = document.getElementById("root");

  function rewards(r) {
    if (!r.items.length) {
      return `<div class="slots"><div class="slot"><div class="name">Reward scan</div>
        <div class="err">${esc(r.error || "No reward names recognized.")}</div></div></div>`;
    }
    // Items read without cards come in order, one panel each.
    const cards = Math.max(1, r.cards ?? r.items.length);
    const slots = [];
    for (let k = 0; k < cards; k++) {
      const it = r.items.find((x, i) => (x.slot ?? i) === k);
      if (!it) {
        slots.push(`<div class="slot empty"></div>`);
        continue;
      }
      const best = r.best === it.name;
      const bits = [`owned ${it.have}`];
      if (it.needed > it.have) bits.push(`<span class="needed">needed</span>`);
      if (it.vaulted === true) bits.push(`<span class="vaulted">vaulted</span>`);
      const ducats = it.ducats > 0 ? `<span class="ducats"><img src="/icons/ducats.png" alt="">${it.ducats}</span>` : "";
      slots.push(`<div class="slot${best ? " best" : ""}">
        <div class="top"><span class="name">${esc(it.name)}</span>${best ? `<span class="tag">BEST</span>` : ""}</div>
        <div class="money"><img class="p" src="/icons/platinum.png" alt="">
          <span class="plat${it.price == null ? " none" : ""}">${it.price ?? "–"}</span>${ducats}</div>
        <div class="info">${bits.join(" · ")}</div></div>`);
    }
    return `<div class="slots">${slots.join("")}</div>`;
  }

  function riven(r) {
    let body;
    if (r.error) {
      body = `<div>${esc(r.error)}</div>`;
    } else {
      const p = r.positives ?? 0, n = r.negatives ?? 0;
      const unread = r.unread === 1 ? " · 1 stat not readable" : r.unread > 1 ? ` · ${r.unread} stats not readable` : "";
      const rows = r.stats.map((g) => {
        const cls = g.grade[0] === "A" ? "a" : g.grade[0] === "B" ? "b" : "c";
        return `<div class="row"><span class="stat">${g.negative ? "−" : "+"}<b>${Math.abs(g.value)}</b> ${esc(g.stat)}</span>
          <span class="grade ${cls}">${esc(g.grade)}</span>
          <span class="dev">${g.deviation > 0 ? "+" : ""}${g.deviation.toFixed(2)}%</span></div>`;
      });
      body = `<div>${p} positive${p === 1 ? "" : "s"}${n > 0 ? " + negative" : ""}${unread}</div>${rows.join("")}`;
      if (r.stats.some((g) => g.outOfRange)) body += `<div class="warn">Values outside ±10%: the stat count or weapon looks wrong.</div>`;
      if (r.stats.some((g) => g.signConflict)) body += `<div class="warn">A stat shows a sign it cannot roll with: the sign was misread.</div>`;
      body += `<div class="foot">Grades compare the roll with an average roll, not with what is useful.</div>`;
    }
    const dots = r.disposition != null ? `<span class="dots">${DOTS[r.dots ?? 0] ?? ""} ${r.disposition}×</span>` : "";
    return `<div class="panel"><div class="top"><span class="weapon">${esc(r.weapon ?? "Riven")}</span>${dots}</div>${body}</div>`;
  }

  // The native window owns the hide timer, including during delayed price updates.
  window.render = (kind, result, unit) => {
    document.documentElement.style.setProperty("--u", `${unit || 1}px`);
    root.innerHTML = kind === "riven" ? riven(result) : rewards(result);
  };
  window.ipc.postMessage("ready");
</script>
</body>
</html>
