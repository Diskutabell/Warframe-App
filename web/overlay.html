<!doctype html>
<!-- The in-game overlays on Windows: one transparent window per overlay loads this page, and the
     app calls render() with a scan result. On Linux the overlays are GTK widgets instead
     (src/desktop/overlay.rs); the look is the same. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 13px "Source Sans 3", "Segoe UI", sans-serif; color: #a3b0b8; }
  #root { height: 100%; box-sizing: border-box; position: relative; }
  .close { position: absolute; top: 2px; right: 6px; font-size: 18px; color: #a3b0b8; cursor: pointer; }
  .close:hover { color: #e9e4d6; }

  .bar { display: flex; gap: 6px; height: 100%; box-sizing: border-box; padding: 6px;
         background: rgba(14, 22, 29, 0.92); border: 1px solid #2d4150; border-radius: 4px; }
  .card { flex: 1 1 0; min-width: 0; padding: 8px 12px; background: rgba(33, 50, 64, 0.55);
          border-top: 3px solid #2d4150; display: flex; flex-direction: column; gap: 2px; }
  .card.best { border-top-color: #d4b26a; background: rgba(56, 52, 34, 0.6); }
  .name { font: 600 15px "Rajdhani", "Arial Narrow", sans-serif; color: #e9e4d6; height: 36px;
          overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .price { font: 700 34px "Rajdhani", "Arial Narrow", sans-serif; color: #d4b26a; }
  .price small { font-size: 60%; color: #a3b0b8; }
  .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .needed { color: #7fc8c2; font-weight: 600; }
  .vaulted { color: #df8a63; }

  .panel { height: 100%; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
           background: rgba(8, 10, 14, 0.93); border: 1px solid #2d4150; border-left: 3px solid #d4b26a; border-radius: 4px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .weapon { font: 700 23px "Rajdhani", sans-serif; color: #eee; }
  .dots { color: #d4b26a; font-size: 15px; }
  .row { display: flex; gap: 10px; align-items: baseline; border-top: 1px solid #1e2b36; padding: 6px 0; }
  .stat { flex: 1; font-size: 16px; color: #eee; }
  .grade { font: 700 17px "Rajdhani", sans-serif; }
  .grade.a { color: #8ce39a; } .grade.b { color: #d4b26a; } .grade.c { color: #e2895f; }
  .dev { width: 8ch; text-align: right; }
  .warn { color: #e2895f; }
  .foot { color: #6d7b88; font-size: 11.5px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const DOTS = ["", "●○○○○", "●●○○○", "●●●○○", "●●●●○", "●●●●●"];
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const root = document.getElementById("root");

  // Hiding is decided here, so hovering can keep the overlay open: the app only shows the
  // window, and is told when to hide it again.
  let hideAt = 0, held = false;
  const hide = () => { hideAt = 0; window.ipc.postMessage("hide"); };
  setInterval(() => { if (hideAt && !held && Date.now() >= hideAt) hide(); }, 200);
  document.addEventListener("mouseenter", () => { held = true; });
  document.addEventListener("mouseleave", () => {
    held = false;
    if (hideAt) hideAt = Math.max(hideAt, Date.now() + 3000);
  });

  function strip(r) {
    const cards = r.items.map((it) => {
      const bits = [];
      if (it.ducats > 0) bits.push(`${it.ducats}d`);
      bits.push(`own ${it.have}`);
      if (it.needed > it.have) bits.push(`<span class="needed">needed</span>`);
      if (it.vaulted === true) bits.push(`<span class="vaulted">vaulted</span>`);
      return `<div class="card${r.best === it.name ? " best" : ""}">
        <div class="name">${esc(it.name)}</div>
        <div class="price">${it.price ?? "?"}<small>p</small></div>
        <div class="line">${bits.join(" · ")}</div></div>`;
    });
    return `<div class="bar">${cards.join("")}</div><span class="close" title="Hide" onclick="hide()">×</span>`;
  }

  function riven(r) {
    let body;
    if (r.error) {
      body = `<div>${esc(r.error)}</div>`;
    } else {
      const p = r.positives ?? 0, n = r.negatives ?? 0;
      const unread = r.unread === 1 ? " · 1 stat not readable" : r.unread > 1 ? ` · ${r.unread} stats not readable` : "";
      const rows = r.stats.map((g) => {
        const cls = g.grade[0] === "A" ? "a" : g.grade[0] === "B" ? "b" : "c";
        return `<div class="row"><span class="stat">${g.negative ? "−" : "+"}<b>${Math.abs(g.value)}</b> ${esc(g.stat)}</span>
          <span class="grade ${cls}">${esc(g.grade)}</span>
          <span class="dev">${g.deviation > 0 ? "+" : ""}${g.deviation.toFixed(2)}%</span></div>`;
      });
      body = `<div>${p} positive${p === 1 ? "" : "s"}${n > 0 ? " + negative" : ""}${unread}</div>${rows.join("")}`;
      if (r.stats.some((g) => g.outOfRange)) body += `<div class="warn">Values outside ±10%: the stat count or weapon looks wrong.</div>`;
      if (r.stats.some((g) => g.signConflict)) body += `<div class="warn">A stat shows a sign it cannot roll with: the sign was misread.</div>`;
      body += `<div class="foot">Grades compare the roll with an average roll, not with what is useful.</div>`;
    }
    const dots = r.disposition != null ? `<span class="dots">${DOTS[r.dots ?? 0] ?? ""} ${r.disposition}×</span>` : "";
    return `<div class="panel"><div class="top"><span class="weapon">${esc(r.weapon ?? "Riven")}</span>${dots}</div>${body}</div>`;
  }

  // Called by the app: kind is "rewards" or "riven", seconds how long to stay up (0: keep the
  // current timer, for a price update of a strip that is already showing).
  window.render = (kind, result, seconds) => {
    root.innerHTML = kind === "riven" ? riven(result) : strip(result);
    if (seconds > 0) { held = false; hideAt = Date.now() + seconds * 1000; }
  };
</script>
</body>
</html>
