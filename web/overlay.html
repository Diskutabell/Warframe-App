<!doctype html>
<!-- The in-game overlays on Windows: one transparent window per overlay loads this page, and the
     app calls render() with a scan result, the size to draw at (CSS pixels per unit of the
     reward screen, as the game draws its cards) and where each price panel goes. On Linux the
     overlays are GTK widgets instead (src/desktop/overlay.rs); the look is the same. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts.css">
<style>
  :root { --u: 1px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 13px "Source Sans 3", "Segoe UI", sans-serif; color: #a3b0b8; }
  #root { height: 100%; box-sizing: border-box; position: relative; }

  /* One panel under or above each reward card, where the app places it. */
  .slot { position: absolute; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column;
          justify-content: center; padding: calc(5 * var(--u)) calc(9 * var(--u));
          background: rgba(8, 12, 17, 0.97); border: 1px solid rgba(150, 170, 186, 0.3); border-radius: calc(3 * var(--u)); }
  .slot.best { background: rgba(45, 37, 15, 0.97); border-color: #d9b45a; }
  .top { display: flex; align-items: center; gap: calc(6 * var(--u)); min-width: 0; }
  .name { flex: 1; min-width: 0; font: 600 calc(14.5 * var(--u)) "Rajdhani", "Arial Narrow", sans-serif; color: #a9b7c2;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font: 700 calc(12 * var(--u)) "Rajdhani", sans-serif; color: #1b1407; background: #d9b45a;
         border-radius: 2px; padding: 0 calc(4 * var(--u)); }
  .money { display: flex; align-items: center; gap: calc(4 * var(--u)); }
  .money .p { height: calc(20 * var(--u)); }
  .plat { font: 700 calc(27 * var(--u)) / 1.15 "Rajdhani", "Arial Narrow", sans-serif; color: #f1d58b; }
  .plat.none { color: #6f7d89; }
  .ducats { margin-left: auto; display: flex; align-items: center; gap: calc(3 * var(--u));
            font: 600 calc(16 * var(--u)) "Rajdhani", sans-serif; color: #c9aa65; }
  .ducats img { height: calc(16 * var(--u)); }
  .info { font-size: calc(13 * var(--u)); color: #8a99a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .needed { color: #6fd1c6; font-weight: 700; }
  .vaulted { color: #e39a6b; }
  .err { color: #e2895f; font-size: calc(13 * var(--u)); }

  /* The riven grades beside the card. */
  .riven { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: calc(6 * var(--u));
           padding: calc(9 * var(--u)); background: rgba(8, 12, 17, 0.97); border: 1px solid rgba(150, 170, 186, 0.3);
           border-top: calc(3 * var(--u)) solid #9a80e8; border-radius: calc(3 * var(--u)); }
  .rhead { display: flex; align-items: center; gap: calc(8 * var(--u)); }
  .rhead img { width: calc(40 * var(--u)); height: calc(40 * var(--u)); object-fit: contain; }
  .rhead .names { flex: 1; min-width: 0; }
  .weapon { font: 700 calc(21 * var(--u)) / 1.1 "Rajdhani", sans-serif; color: #eeeae0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: calc(13 * var(--u)); color: #8a99a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .overall { font: 700 calc(20 * var(--u)) "Rajdhani", sans-serif; color: #0b1016; border-radius: calc(3 * var(--u)); padding: 0 calc(4 * var(--u)); }
  .overall.a { background: #8ce39a; } .overall.b { background: #d9b45a; } .overall.c { background: #e2895f; }
  .rule { border-top: 1px solid rgba(150, 170, 186, 0.18); padding-top: calc(5 * var(--u)); display: grid; gap: calc(3 * var(--u)); }
  .line { display: flex; align-items: baseline; gap: calc(8 * var(--u)); min-width: 0; }
  .grade { width: 2ch; font: 700 calc(17 * var(--u)) "Rajdhani", sans-serif; }
  .grade.a { color: #8ce39a; } .grade.b { color: #d9b45a; } .grade.c { color: #e2895f; }
  .stat { flex: 1; min-width: 0; font-size: calc(15 * var(--u)); color: #e9e4d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev { font: 600 calc(13 * var(--u)) "Rajdhani", sans-serif; color: #8a99a6; }
  .roll { height: calc(5 * var(--u)); background: rgba(255, 255, 255, 0.08); position: relative; }
  .roll i { position: absolute; left: 0; top: 0; bottom: 0; }
  .roll b { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, 0.35); }
  .roll.a i { background: #8ce39a; } .roll.b i { background: #d9b45a; } .roll.c i { background: #e2895f; }
  .price { display: flex; align-items: center; gap: calc(5 * var(--u)); min-width: 0; }
  .price img { height: calc(17 * var(--u)); }
  .price .v { font: 700 calc(16 * var(--u)) "Rajdhani", sans-serif; color: #f1d58b; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const root = document.getElementById("root");

  // `boxes`: x, y, width, height of each panel in this window, one per card (one for a message).
  const at = (b) => `left:${b[0]}px;top:${b[1]}px;width:${b[2]}px;height:${b[3]}px`;

  function rewards(r, boxes) {
    if (!r.items.length) {
      return `<div class="slot" style="${at(boxes[0])}"><div class="name">Reward scan</div>
        <div class="err">${esc(r.error || "No reward names recognized.")}</div></div>`;
    }
    // Items read without cards come in order; a card read without a name gets no panel.
    const slots = [];
    for (let k = 0; k < boxes.length; k++) {
      const it = r.items.find((x, i) => (x.slot ?? i) === k);
      if (!it) continue;
      const best = r.best === it.name;
      const bits = [`owned ${it.have}`];
      if (it.needed > it.have) bits.push(`<span class="needed">needed</span>`);
      if (it.vaulted === true) bits.push(`<span class="vaulted">vaulted</span>`);
      const ducats = it.ducats > 0 ? `<span class="ducats"><img src="/icons/ducats.png" alt="">${it.ducats}</span>` : "";
      slots.push(`<div class="slot${best ? " best" : ""}" style="${at(boxes[k])}">
        <div class="top"><span class="name">${esc(it.name)}</span>${best ? `<span class="tag">BEST</span>` : ""}</div>
        <div class="money"><img class="p" src="/icons/platinum.png" alt="">
          <span class="plat${it.price == null ? " none" : ""}">${it.price ?? "–"}</span>${ducats}</div>
        <div class="info">${bits.join(" · ")}</div></div>`);
    }
    return slots.join("");
  }

  const gradeClass = (g) => (g[0] === "A" ? "a" : g[0] === "B" ? "b" : "c");
  const UNITS = { "Punch Through": "m", "Combo Duration": "s", "Initial Combo": "" };

  function riven(r) {
    const p = r.positives, n = r.negatives;
    let sub = r.error ? "Riven" : `${p} positives${n > 0 ? " + 1 negative" : ""}`;
    if (!r.error && r.unread) sub += ` · ${r.unread} not readable`;
    const head = `<div class="rhead">${r.image ? `<img src="/api/art?s=80&u=${encodeURIComponent(r.image)}" alt="" onerror="this.remove()">` : ""}
      <div class="names"><div class="weapon">${esc(r.weapon ?? "Riven")}</div><div class="sub">${esc(sub)}</div></div>
      ${r.overall ? `<span class="overall ${gradeClass(r.overall)}" title="The average roll">${esc(r.overall)}</span>` : ""}</div>`;
    if (r.error) return `<div class="riven">${head}<div class="err">${esc(r.error)}</div></div>`;
    const rows = r.stats.map((g) => {
      const c = gradeClass(g.grade), at = Math.max(0, Math.min(100, (g.deviation + 10) * 5));
      return `<div class="rule"><div class="line"><span class="grade ${c}">${esc(g.grade)}</span>
        <span class="stat">${g.negative ? "−" : "+"}<b>${Math.abs(g.value)}${UNITS[g.stat] ?? "%"}</b> ${esc(g.stat)}</span>
        <span class="dev">${g.deviation > 0 ? "+" : ""}${g.deviation.toFixed(1)}%</span></div>
        <div class="roll ${c}"><i style="width:${at}%"></i><b></b></div></div>`;
    }).join("");
    const warn = (r.stats.some((g) => g.outOfRange) ? `<div class="err">Some values are outside the ±10% a roll can land in: a stat was misread.</div>` : "")
      + (r.stats.some((g) => g.signConflict) ? `<div class="err">A stat shows a sign it cannot roll with: the sign was misread.</div>` : "");
    const m = r.market;
    const listed = m && m.count > 0
      ? `<span class="v">${m.lowest}</span><span class="sub">lowest${m.median != null ? ` · ${m.median} median` : ""}${m.lowestOnline != null ? ` · ${m.lowestOnline} in game` : ""} · ${m.count} listed</span>`
      : `<span class="sub">${m ? "No listings with these positives" : r.marketError ? "warframe.market did not answer" : "Looking up listings…"}</span>`;
    const med = (k) => r.traded?.[k]?.median;
    const sold = [med("unrolled") != null ? `${Math.round(med("unrolled"))} unrolled` : "", med("rerolled") != null ? `${Math.round(med("rerolled"))} rerolled` : ""].filter(Boolean).join(" · ");
    return `<div class="riven">${head}${rows}${warn}<div class="rule"><div class="price"><img src="/icons/platinum.png" alt="">${listed}</div>
      <div class="sub">warframe.market, same weapon and positives</div>${sold ? `<div class="sub">Sold lately: ${sold}</div>` : ""}</div></div>`;
  }

  // The native window owns the hide timer, including during delayed price updates.
  window.render = (kind, result, unit, boxes) => {
    document.documentElement.style.setProperty("--u", `${unit || 1}px`);
    root.innerHTML = kind === "riven" ? riven(result) : rewards(result, boxes || []);
  };
  window.ipc.postMessage("ready");
</script>
</body>
</html>
